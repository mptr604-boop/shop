services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    image: ${SHOP_IMAGE:-shop}:${RELEASE_TAG:-local}-migrator
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - tools

  api:
    image: ${SHOP_IMAGE:-shop}:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["npm", "run", "start", "--workspace", "@shop/api"]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: ${SHOP_IMAGE:-shop}:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["npm", "run", "start", "--workspace", "@shop/web"]
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set SHOP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
