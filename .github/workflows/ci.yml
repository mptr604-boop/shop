name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure test database
        run: cp .env.example .env

      - name: Validate deployment configuration
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD_HASH: test-placeholder
          POSTGRES_PASSWORD: test-deployment-password
          DATABASE_URL: postgresql://shop:test-deployment-password@database:5432/shop_staging
          SHOP_DOMAIN: staging.example.com
          SHOP_IMAGE: shop-staging
        run: |
          bash -n deploy/scripts/*.sh
          command -v python3
          docker compose --project-name shop-staging \
            --env-file deploy/.env.staging.example \
            -f deploy/compose.yml config --quiet
          node --test tests/deploy/*.test.mjs

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed sample products
        run: npm run db:seed

      - name: Check types
        run: npm run typecheck

      - name: Run API integration tests
        run: npm run test:api

      - name: Build applications
        run: npm run build

      - name: Build production Docker images
        run: |
          docker build -f deploy/Dockerfile --target runtime -t shop:ci .
          docker build -f deploy/Dockerfile --target migrator -t shop:ci-migrator .

  publish-images:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Generate runtime image metadata
        id: runtime-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.runtime-meta.outputs.tags }}
          labels: ${{ steps.runtime-meta.outputs.labels }}
          cache-from: type=gha,scope=shop-runtime
          cache-to: type=gha,mode=max,scope=shop-runtime

      - name: Generate migrator image metadata
        id: migrator-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch,suffix=-migrator
            type=sha,format=long,prefix=sha-,suffix=-migrator
            type=semver,pattern={{version}},suffix=-migrator
            type=raw,value=latest-migrator,enable={{is_default_branch}}

      - name: Build and publish migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: migrator
          push: true
          tags: ${{ steps.migrator-meta.outputs.tags }}
          labels: ${{ steps.migrator-meta.outputs.labels }}
          cache-from: type=gha,scope=shop-migrator
          cache-to: type=gha,mode=max,scope=shop-migrator
