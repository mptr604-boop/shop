name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure test database
        run: cp .env.example .env

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed sample products
        run: npm run db:seed

      - name: Check types
        run: npm run typecheck

      - name: Run API integration tests
        run: npm run test:api

      - name: Build applications
        run: npm run build
