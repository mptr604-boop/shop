name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure test database
        run: cp .env.example .env

      - name: Validate deployment configuration
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD_HASH: test-placeholder
          POSTGRES_PASSWORD: test-deployment-password
          DATABASE_URL: postgresql://shop:test-deployment-password@database:5432/shop_staging
          SHOP_DOMAIN: staging.example.com
          SHOP_IMAGE: shop-staging
        run: |
          bash -n deploy/scripts/*.sh
          command -v python3
          docker compose --project-name shop-staging \
            --env-file deploy/.env.staging.example \
            -f deploy/compose.yml config --quiet
          node --test tests/deploy/*.test.mjs

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed sample products
        run: npm run db:seed

      - name: Check types
        run: npm run typecheck

      - name: Run API integration tests
        run: npm run test:api

      - name: Build applications
        run: npm run build

      - name: Build production Docker images
        run: |
          docker build -f deploy/Dockerfile --target runtime -t shop:ci .
          docker build -f deploy/Dockerfile --target migrator -t shop:ci-migrator .
